name: CI

on:
  push:
    branches: ["main", "master", "fftw"]
  pull_request:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install FFTW3
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...
