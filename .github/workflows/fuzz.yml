name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  fuzz:
    name: Go fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Fuzz ParseMessage
        run: go test -run '^$' -fuzz=FuzzParseMessage -fuzztime=30s .

      - name: Fuzz ReadWAVMono
        run: go test -run '^$' -fuzz=FuzzReadWAVMono -fuzztime=30s .

      - name: Fuzz Pack77
        run: go test -run '^$' -fuzz=FuzzPack77 -fuzztime=30s ./internal/protocol
